services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
      - sonic
      - qdrant
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=cuento
      - SUPERUSER_ID=3
      - SONIC_HOST=sonic
      - SONIC_PORT=1491
      - SONIC_PASSWORD=SecretPassword
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - IMAGE_PROXY_BASE_URL=http://localhost:8080/image/proxy

  db:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cuento
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  sonic:
    image: valeriansaliou/sonic:latest
    restart: unless-stopped
    ports:
      - "1491:1491"
    volumes:
      - ./sonic.cfg:/etc/sonic.cfg
      - sonic_data:/var/lib/sonic/store

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend:/usr/share/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
  sonic_data:
  qdrant_data:
